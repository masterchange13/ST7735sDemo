name: Auto Publish Workflow

# 触发条件：push 到 "push" 分支 或 手动触发
on:
  push:
    branches:
      - push
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release version'
        default: 'v1.0.0'
        required: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: 压缩整个代码库
      - name: Zip the code
        run: |
          echo "Zipping the code..."
          Compress-Archive -Path './*' -DestinationPath './source_code.zip'

      # Step 3: 创建 GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_name || 'v1.0.0' }}
          release_name: ${{ github.event.inputs.release_name || 'v1.0.0' }}
          body: 'Automated release with compressed source code'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: 上传压缩文件到 Release
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./source_code.zip
          asset_name: source_code.zip
          asset_content_type: application/zip
