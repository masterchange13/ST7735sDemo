name: Auto Publish Workflow

on:
  push:
    branches:
      - push
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release version'
        default: 'v1.0.0'
        required: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: 压缩整个代码库
      - name: Zip the code
        run: |
          echo "Zipping the code..."
          Compress-Archive -Path './*' -DestinationPath './source_code.zip'

      # Step 3: 创建 GitHub Release 并上传资源
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: source_code.zip
          tag_name: ${{ github.event.inputs.release_name || 'v1.0.0' }}
          name: ${{ github.event.inputs.release_name || 'v1.0.0' }}
          body: 'Automated release with compressed source code'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
